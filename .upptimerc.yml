# Docs: https://upptime.js.org/docs/configuration/
owner: deep-navy
repo: status
user-agent: deep-navy
secrets: []
skipDeleteIssues: true
sites:
  - name: Customer website
    slug: website
    url: https://deep.navy/
    expectedStatusCodes: [200]
  - name: Public API catalog
    slug: api
    url: https://api.deep.navy/deepnavy.catalog.v1.CatalogService/ListTools
    method: POST
    headers:
      - "Content-Type: application/json"
    body: '{}'
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"tools"'
  - name: MCP authentication edge
    slug: mcp-edge
    url: https://mcp.deep.navy/mcp
    expectedStatusCodes: [401]
  - name: OAuth resource discovery
    slug: oauth-discovery
    url: https://mcp.deep.navy/.well-known/oauth-protected-resource
    expectedStatusCodes: [200]
    __dangerous__body_down_if_text_missing: '"authorization_servers"'
status-website:
  cname: status.deep.navy
  name: deep.navy status
  logoUrl: https://deep.navy/icons/120.png
  favicon: https://deep.navy/icons/120.png
  theme: dark
  introTitle: 'Service status'
  introMessage: 'Measured availability from scheduled external checks. The MCP edge check verifies rejection of unauthenticated requests, not authenticated tool execution. API catalog checks do not prove every dataset is fresh. Schedules can be delayed; inspect the latest check time and incident history.'
  navbar:
    - title: Status
      href: /
    - title: Incidents
      href: https://github.com/deep-navy/status/issues
    - title: Documentation
      href: https://deep.navy/docs
# Upptime owns its generated workflows. This separate workflow deploys the generated
# gh-pages output through GitHub's official artifact deploy, without a personal token.
